---

# Problems that exist before the update are not caused by this role, only fail on new ones.
- name: client | Check for broken requirements before changes
  ansible.builtin.command:
    cmd: "{{ client }} check"
  changed_when: false
  failed_when: false
  register: update_pip_packages_check_before

# Packages installed by the distribution (installer "debian", "rpm", ...) cannot be uninstalled by pip, only update
# the packages pip installed itself.
- name: client | Get all installed packages for {{ client }}
  ansible.builtin.command:
    cmd: "{{ client }} list --verbose --format json"
  changed_when: false
  register: update_pip_packages
  environment:
    PATH: "/bin:/usr/bin:/usr/local/bin"

# All packages are updated in one call, so that pip's resolver keeps the requirements of the packages consistent.
- name: client | Update packages
  ansible.builtin.pip:
    name: "{{ _update_pip_packages_names }}"
    executable: "{{ client }}"
    state: latest  # noqa package-latest
    break_system_packages: true
  environment:
    PATH: "/bin:/usr/bin:/usr/local/bin"
  vars:
    _update_pip_packages_names: "{{ update_pip_packages.stdout | from_json | selectattr('installer', 'defined') | selectattr('installer', 'equalto', 'pip') | map(attribute='name') | difference(update_pip_package_ignore | default([])) | list }}"
  when:
    - _update_pip_packages_names | length > 0

- name: client | Check for broken requirements after changes
  ansible.builtin.command:
    cmd: "{{ client }} check"
  changed_when: false
  failed_when:
    - update_pip_packages_check_after.stdout_lines | difference(update_pip_packages_check_before.stdout_lines) | length > 0
  register: update_pip_packages_check_after
